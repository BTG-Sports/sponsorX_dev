<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SponsorX logo files — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080B;color:#F4F5F7;font:400 14px/1.5 Poppins,sans-serif;padding:40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
figure{margin:0;border:1px solid #242A38;border-radius:10px;overflow:hidden;background:#0A0C10}
figure.light{background:#F4F5F7}
figcaption{padding:10px 14px;font:600 11px/1 Poppins;letter-spacing:.12em;color:#8A90A2;background:#12151D;border-top:1px solid #242A38}
img{display:block;max-width:100%;margin:26px auto}
</style>
</head>
<body>
<figure><img src="sponsorx-horizontal-dark.svg" alt=""><figcaption>HORIZONTAL · DARK</figcaption></figure>
<figure class="light"><img src="sponsorx-horizontal-light.svg" alt=""><figcaption>HORIZONTAL · LIGHT</figcaption></figure>
<figure><img src="sponsorx-stacked-dark.svg" alt=""><figcaption>STACKED · DARK</figcaption></figure>
<figure class="light"><img src="sponsorx-stacked-light.svg" alt=""><figcaption>STACKED · LIGHT</figcaption></figure>
<figure><img src="sponsorx-wordmark-dark.svg" alt=""><figcaption>WORDMARK · DARK</figcaption></figure>
<figure class="light"><img src="sponsorx-wordmark-light.svg" alt=""><figcaption>WORDMARK · LIGHT</figcaption></figure>
<figure><img src="sponsorx-tagline-dark.svg" alt=""><figcaption>TAGLINE · DARK</figcaption></figure>
<figure class="light"><img src="sponsorx-tagline-light.svg" alt=""><figcaption>TAGLINE · LIGHT</figcaption></figure>
<figure><img src="btg-badge-dark.svg" alt="" width="120"><figcaption>BADGE · DARK</figcaption></figure>
<figure class="light"><img src="btg-badge-light.svg" alt="" width="120"><figcaption>BADGE · LIGHT</figcaption></figure>
<figure><img src="sponsorx-x-dark.svg" alt="" width="124"><figcaption>X MARK · DARK</figcaption></figure>
<figure><img src="favicon-32.svg" alt="" width="32"><img src="apple-touch-icon-180.svg" alt="" width="180"><figcaption>FAVICON 32 · APP ICON 180</figcaption></figure>
</body>
</html>
