# Tracker → the published Google Sheet, on every change to main.
# Writes exactly the tasks that changed into the Sheet (changed cells only, by
# task ID), as often as the tracker changes. Posts NOTHING to Slack: since
# 2026-10-01 Slack hears once a day, from the 8 pm digest (tracker-digest.yml),
# which lists every change of the day.
# Reads the repo only — never commits. Script: scripts/tracker/tracker_sync.py
name: Tracker sheet sync

on:
  push:
    branches: [main]
    paths: ["Claude outputs/SponsorX-Full-Programme-Task-Board.xlsx"]
  workflow_dispatch:

concurrency:
  group: tracker-sync
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous tracker is read from history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install openpyxl==3.1.5

      - name: Test the script
        run: python -m unittest discover scripts/tracker/tests

      - name: Update the Sheet
        env:
          SHEET_ENDPOINT_URL: ${{ secrets.SHEET_ENDPOINT_URL }}
          SHEET_ENDPOINT_SECRET: ${{ secrets.SHEET_ENDPOINT_SECRET }}
        run: |
          python scripts/tracker/tracker_sync.py notify --no-slack \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --author "${{ github.event.head_commit.author.name || github.actor }}"
