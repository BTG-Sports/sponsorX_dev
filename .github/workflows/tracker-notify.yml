# Tracker → Slack, on every change to main.
# Each merge to main that changes tasks posts ONE Slack message listing exactly
# those tasks. Since 2026-10-07 (owner's decision): merges are announced as they
# land, and the 8 pm digest (tracker-digest.yml) posts only on days with none.
# Slack only since 2026-11-15 (user's decision): the Google Sheet write is
# switched off by not passing SHEET_ENDPOINT_URL / SHEET_ENDPOINT_SECRET (its
# Apps Script endpoint answered 404 on every run). The secrets stay in GitHub;
# add the two env lines back to switch the Sheet on again.
# Reads the repo only — never commits. Script: scripts/tracker/tracker_sync.py
name: Tracker sync

on:
  push:
    branches: [main]
    paths: ["Claude outputs/SponsorX-Full-Programme-Task-Board.xlsx"]
  workflow_dispatch:

concurrency:
  group: tracker-sync
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous tracker is read from history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install openpyxl==3.1.5

      - name: Test the script
        run: python -m unittest discover scripts/tracker/tests

      - name: Announce in Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scripts/tracker/tracker_sync.py notify \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --author "${{ github.event.head_commit.author.name || github.actor }}"
