# Tracker → Slack and the published Google Sheet, on every change to main.
# Each merge to main that changes tasks posts ONE Slack message listing exactly
# those tasks, and writes the same changes into the Sheet (changed cells only,
# by task ID). Since 2026-10-07 (owner's decision): merges are announced as they
# land, and the 8 pm digest (tracker-digest.yml) posts only on days with none.
# Reads the repo only — never commits. Script: scripts/tracker/tracker_sync.py
name: Tracker sync

on:
  push:
    branches: [main]
    paths: ["Claude outputs/SponsorX-Full-Programme-Task-Board.xlsx"]
  workflow_dispatch:

concurrency:
  group: tracker-sync
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous tracker is read from history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install openpyxl==3.1.5

      - name: Test the script
        run: python -m unittest discover scripts/tracker/tests

      - name: Announce in Slack and update the Sheet
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SHEET_ENDPOINT_URL: ${{ secrets.SHEET_ENDPOINT_URL }}
          SHEET_ENDPOINT_SECRET: ${{ secrets.SHEET_ENDPOINT_SECRET }}
        run: |
          python scripts/tracker/tracker_sync.py notify \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --author "${{ github.event.head_commit.author.name || github.actor }}"
