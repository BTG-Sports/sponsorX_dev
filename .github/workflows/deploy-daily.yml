# The daily deploy, right after the 8 pm Manila CI run (2026-10-01, at the
# user's instruction).
#
# Railway deploys staging and production from the `release` branch, not from
# `main`. When the nightly CI run (ci.yml) on `main` finishes and passed, this
# moves `release` up to that commit, and Railway, watching `release`, deploys
# both services in both environments at that commit. Chained to CI rather than
# given its own time, so a late-starting CI run can never make it miss.
#
# Nothing new on `main`, or checks not green: nothing moves, nothing deploys.
# Manual deploys are unchanged: Railway's own Deploy / Redeploy buttons, or
# `npm run deploy` (scripts/deploy.mjs), at any time.
#
# Never writes to `main`; it only moves `release`. Needs no Railway key.
name: Daily deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to move the release branch
  checks: read    # to read main's check results

concurrency:
  group: deploy-daily
  cancel-in-progress: false

jobs:
  release:
    # After CI: only when it passed, and only the nightly or a hand-started run.
    # Since P2-OPS-07 (2026-10-07) CI also runs on every push, a merge to
    # `main` included; that run checks the commit but must not deploy it.
    # By hand: always try (the checks below still apply).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Move release to main if main is new and green
        id: move
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          SUBJECT=$(git log -1 --format=%s "$SHA")
          echo "main is ${SHA:0:7}  $SUBJECT"

          if git ls-remote --exit-code --heads origin release >/dev/null; then
            CURRENT=$(git ls-remote --heads origin release | cut -f1)
            if [ "$CURRENT" = "$SHA" ]; then
              echo "release is already at ${SHA:0:7} — nothing new to deploy today."
              exit 0
            fi
          fi

          # CI's two jobs (ci.yml) must both have run on this commit and passed.
          # Other workflows on the same commit — the tracker jobs, this one —
          # are not checks of the code and are ignored. A commit on `main` is
          # checked more than once (the push run, then tonight's run), so only
          # the latest run of each job counts: an earlier failure that tonight's
          # run has since passed does not hold the deploy back.
          RUNS=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select((.name | startswith("typecheck")) or (.name | startswith("e2e")))] | group_by(.name) | map(max_by(.id) | {name, status, conclusion})')
          echo "CI on ${SHA:0:7}: $RUNS"
          TOTAL=$(echo "$RUNS" | jq 'length')
          GREEN=$(echo "$RUNS" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [ "$TOTAL" -lt 2 ]; then
            echo "::warning::CI has not run on ${SHA:0:7} — not deploying. Deploy by hand if this is intended."
            exit 0
          fi
          if [ "$GREEN" -ne "$TOTAL" ]; then
            echo "::warning::Checks on ${SHA:0:7} are not all green ($GREEN of $TOTAL) — not deploying today."
            exit 0
          fi

          git push --force origin "$SHA:refs/heads/release"
          echo "release → ${SHA:0:7}. Railway is deploying staging and production."
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      # POL-BE-113 — after a deploy, prove a browser can still upload. The
      # worker runs the live storage check when it starts (both storage areas:
      # a preflight as the website, a signed upload, a read back, a delete);
      # /api/v1/public/health carries its result. Wait for a check newer than
      # this deploy on each environment, up to 30 minutes, and go red if it
      # failed or never came. The uptime monitor alerts BTG on Slack as well.
      - name: After the deploy, check uploads work on staging and production
        if: steps.move.outputs.deployed == 'true'
        env:
          SINCE: ${{ steps.move.outputs.since }}
        run: |
          set -uo pipefail
          bad=0
          for base in https://web-staging-904a.up.railway.app https://sponsorx.net; do
            verdict=""
            for i in $(seq 1 60); do
              body=$(curl -s --max-time 20 "$base/api/v1/public/health" || true)
              at=$(echo "$body" | jq -r '.checks.storageUploads.checkedAt // empty' 2>/dev/null || true)
              if [ -n "$at" ] && [[ "$at" > "$SINCE" ]]; then
                ok=$(echo "$body" | jq -r '.checks.storageUploads.ok')
                problem=$(echo "$body" | jq -r '.checks.storageUploads.problem // ""')
                if [ "$ok" = "true" ]; then verdict="ok"; else verdict="failed: $problem"; fi
                break
              fi
              sleep 30
            done
            if [ "$verdict" = "ok" ]; then
              echo "$base — uploads work (checked $at)"
            elif [ -n "$verdict" ]; then
              echo "::error::$base — the storage check $verdict"; bad=1
            else
              echo "::error::$base — no storage check newer than the deploy within 30 minutes (is the worker running?)"; bad=1
            fi
          done
          exit $bad
