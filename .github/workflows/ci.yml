# Continuous integration — P2-OPS-07, §30, Guide §09.
#
# Once a day, at 8 pm Manila, the latest `main` is type-checked, linted,
# unit-tested and permission-tested — and only if `main` has changed since the
# last deploy. When it passes, deploy-daily.yml ships that commit.
#
# 2026-10-01, at the user's instruction: the account ran out of GitHub Actions
# minutes (≈10 minutes a run, 40–80 runs a day on every push and pull
# request), so CI no longer runs on pushes or pull requests at all — not on
# working branches, not on `main_development`, not on `main`. Run it by hand
# any time from the Actions tab ("Run workflow"), and locally as before. Nothing here is a new kind of check: each step is a
# command that already runs locally. What changes is that it now runs whether
# anyone remembers or not, on a clean machine, where both people working in
# this repo can see the result.
#
# The permission suite is the one that matters most. It asserts all 1,152
# role × resource × action pairs against the agreed RBAC matrix, so widening a
# sponsor's access to fix a bug turns this red and names what else moved. B0's
# stated exit criterion is "authz matrix passes in CI" — this file is what
# makes that sentence mean anything.

name: CI

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC = 8:00 pm Manila, every day
  workflow_dispatch:

# A second push to the same branch makes the first run pointless — cancel it
# rather than queueing behind work nobody is waiting for. Never cancels a run
# on the default branch, where the history of what passed is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A few seconds' check before the ten-minute ones: on the nightly run, if
  # `release` (what is deployed) already equals `main`, there is nothing new
  # to test or deploy, so the heavy jobs are skipped. A hand-started run
  # always tests.
  changed:
    name: anything new on main
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh api "repos/${{ github.repository }}/branches/release" --jq .commit.sha 2>/dev/null || echo none)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$RELEASE" = "${{ github.sha }}" ]; then
            echo "main (${GITHUB_SHA:0:7}) is already deployed — skipping tonight's checks."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: typecheck · lint · unit · authz matrix
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest

    services:
      # Nothing uses this yet, and it is here on purpose.
      #
      # P2-SEC-01's seeded half — two tenants, two sponsors, two athletes, a
      # guardian and a property — proves the scope *filters* return the right
      # rows, and it cannot run without a real database. Adding the service
      # now means whoever writes that suite finds it waiting instead of
      # rediscovering why a plain Node runner is not enough.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sponsorx
          POSTGRES_PASSWORD: sponsorx
          POSTGRES_DB: sponsorx_test
        ports:
          - 5432:5432
        # Without this the job races the database and fails intermittently,
        # which is worse than failing consistently.
        options: >-
          --health-cmd "pg_isready -U sponsorx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sponsorx:sponsorx@localhost:5432/sponsorx_test
      # Clerk is not needed to build or to run these tests — verified by
      # building with the environment file removed. Should a future test need
      # a real key, it goes in repository secrets, never here.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the version CLAUDE.md pins locally. A CI Node that
          # drifts from the developer Node produces failures nobody can
          # reproduce.
          node-version: 24.21.0
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile
      # and fails if package.json and the lockfile disagree, which is the
      # point of running it here.
      - name: Install
        run: npm ci

      # Both build scripts run `prisma generate` first, so the generated
      # client exists before anything type-checks against it. The backend
      # build is `tsc --noEmit` over src and worker; the frontend build
      # type-checks and compiles every route.
      - name: Build the API and worker
        run: npm run build -w @sponsorx/backend

      - name: Build the web app
        run: npm run build -w @sponsorx/frontend

      - name: Lint
        run: npm run lint

      # The seeded half of P2-SEC-01 needs a MIGRATED database, not merely a
      # running one. Without this step the suite skips silently and CI reports
      # green for tests that never ran — which is worse than failing, because
      # it reads as coverage.
      - name: Migrate the test database
        run: npm run prisma:deploy -w @sponsorx/backend

      # The partial indexes Prisma cannot express live in prisma/sql/ and are
      # NOT applied by migrate deploy. Nothing in the matrix suite depends on
      # them today; applied here so a future suite that does finds them.
      - name: Apply the partial indexes
        run: |
          for f in backend/prisma/sql/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      # 2S5-SEC-01 — the audit log is append-only (prisma/sql/ledger_immutable.sql).
      # A TEST database is the one place its rows may be deleted, so suites can
      # clean up after themselves; marked here, and never on staging or production.
      - name: Mark the test database as purgeable
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER DATABASE sponsorx_test SET sponsorx.audit_purge = 'on'"

      # 2S7-BE-02 — the report-render test prints a real PDF in headless
      # Chromium, so this job needs the browser too (same cache as e2e).
      - name: Cache the browser
        uses: actions/cache@v4
        id: unit-playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.unit-playwright-cache.outputs.cache-hit != 'true'
        run: npm run e2e:install

      - name: Test the API — includes the authorisation matrix, seeded
        run: npm run test -w @sponsorx/backend

      - name: Test the web app
        run: npm run test -w @sponsorx/frontend

  # ---------------------------------------------------------------------
  # E2E — P2-QA-01.
  #
  # A SEPARATE JOB, deliberately. The suite above is 442 assertions that
  # finish in under a second and gate every push; a browser run takes tens of
  # seconds and downloads a 82 MB binary. Putting them in one job would make
  # the fast feedback wait for the slow, and the usual response to that is to
  # stop requiring one of them.
  #
  # It runs on the same triggers, so a red E2E is still a red commit.
  e2e:
    name: e2e · playwright
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest

    # The fan-flow specs (P6-QA-01/02) drive the real stack — web → API →
    # Postgres — so this job has its own database and Playwright starts the
    # API beside the web app (playwright.config.ts). Without DATABASE_URL
    # those specs skip; here they must run.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sponsorx
          POSTGRES_PASSWORD: sponsorx
          POSTGRES_DB: sponsorx_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sponsorx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The public routes rate-limit through Redis. Without it every API call
      # waits out the client's reconnect backoff before failing open — calls
      # climbed from 1 s to 4 s and the fan flow timed out.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sponsorx:sponsorx@localhost:5432/sponsorx_e2e
      REDIS_URL: redis://localhost:6379
      # The API validates both Clerk keys at boot; the fan routes never call
      # Clerk, so the test instance's keys are enough.
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_TEST }}
      # Clerk's DEVELOPMENT instance. ClerkProvider wraps the whole app, so
      # without a publishable key every page throws and Playwright times out
      # waiting for a server that never serves a 200 — which is what had been
      # happening since Clerk replaced mock-auth (P2-INT-01). The keys live in
      # frontend/.env.local locally, which is gitignored and so invisible to CI.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_TEST }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install
        run: npm ci

      # Cached by version so a run that changes no dependency does not
      # re-download the browser. The key carries the Playwright version
      # because a browser build is pinned to it.
      - name: Cache the browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run e2e:install

      # The API runs from source under tsx (no build step here), so the
      # Prisma client must be generated explicitly.
      - name: Generate the Prisma client
        run: npm run prisma:generate -w @sponsorx/backend

      - name: Migrate the E2E database
        run: |
          npm run prisma:deploy -w @sponsorx/backend
          for f in backend/prisma/sql/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          # 2S5-SEC-01 — a test database: the append-only audit log may be purged here.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER DATABASE sponsorx_e2e SET sponsorx.audit_purge = 'on'"

      - name: Run the E2E suite
        run: npm run e2e

      # Only on failure: a trace is worth megabytes and nobody opens one for
      # a green run. `trace: on-first-retry` in the config means a flake
      # leaves a recording of the attempt that failed.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
