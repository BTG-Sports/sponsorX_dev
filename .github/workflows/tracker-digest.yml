# The day's one Slack broadcast, at 8 pm Manila: phase progress, every task
# change since the last broadcast, what finished today, what waits in Code
# review, what is newly blocked — and the day's Stage Progress row appended to
# the published Sheet. (The Sheet itself is kept current all day by
# tracker-notify.yml.) Reads the repo only — never commits.
name: Tracker digest

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC = 8:00 pm Manila, every day
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install openpyxl==3.1.5

      - name: Post the digest and append the snapshot row
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SHEET_ENDPOINT_URL: ${{ secrets.SHEET_ENDPOINT_URL }}
          SHEET_ENDPOINT_SECRET: ${{ secrets.SHEET_ENDPOINT_SECRET }}
          TZ: Asia/Manila
        run: python scripts/tracker/tracker_sync.py digest --since "24 hours ago"
